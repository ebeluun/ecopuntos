<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | EcoPuntos</title>
    <script src="js/sesion.js"></script>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <header class="encabezado">
        <a href="index.html" class="logo">♻ EcoPuntos</a>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="registro.html">Registrarse</a>
            <a href="perfil.html">Mi perfil</a>
        </nav>
    </header>

    <main class="contenedor">
        <section class="formulario">
            <h1>Acceso a EcoPuntos</h1>

            <form id="form-login" novalidate>
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo"
                    placeholder="Ingresa tu correo" autocomplete="email"
                    spellcheck="false" required>

                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena"
                    placeholder="Ingresa tu contraseña" autocomplete="current-password"
                    required>

                <a href="#" class="recuperar">¿Olvidaste tu contraseña?</a>

                <button type="submit">Iniciar sesión</button>
                <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
            </form>

            <p class="enlace-registro">
                ¿No tienes una cuenta?
                <a href="registro.html">Regístrate</a>
            </p>
        </section>
    </main>

    <footer>
        EcoPuntos | ¡Cuidar el planeta está en nuestras manos!
    </footer>
    <script src="js/auth.js"></script>
</body>
</html>

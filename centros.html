<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Consulta centros de reciclaje y los materiales que reciben.">
  <title>Centros de reciclaje | EcoPuntos</title>
  <link rel="stylesheet" href="css/centros.css">
  <script src="js/centros-data.js" defer></script>
  <script src="js/centros.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="EcoPuntos, ir al inicio">
      <span class="brand-icon" aria-hidden="true">♻️</span>
      <span>EcoPuntos</span>
    </a>

    <nav class="main-nav" aria-label="Navegación principal">
      <a href="index.html">Inicio</a>
      <span aria-hidden="true">|</span>
      <a href="centros.html" aria-current="page">Centros</a>
      <span aria-hidden="true">|</span>
      <a href="materiales.html">Materiales</a>
      <span aria-hidden="true">|</span>
      <a href="index.html#login-dialog">Iniciar sesión</a>
    </nav>
  </header>

  <main>
    <section class="page-heading" aria-labelledby="page-title">
      <h1 id="page-title">Centros de reciclaje</h1>
      <p>Encuentra un lugar para llevar tus materiales y contribuir con el planeta</p>
    </section>

    <section class="centers-search" aria-label="Buscar centros de reciclaje">
      <label class="search-box" for="search-centers">
        <span aria-hidden="true">🔍</span>
        <input
          id="search-centers"
          type="search"
          placeholder="Buscar por nombre o ubicación..."
          autocomplete="off"
        >
      </label>

      <div class="filter-buttons" role="group" aria-label="Filtrar por material">
        <button class="filter-button active" type="button" data-filter="todos" aria-pressed="true">Todos</button>
        <button class="filter-button" type="button" data-filter="plastico" aria-pressed="false">Plástico</button>
        <button class="filter-button" type="button" data-filter="papel" aria-pressed="false">Papel</button>
        <button class="filter-button" type="button" data-filter="vidrio" aria-pressed="false">Vidrio</button>
        <button class="filter-button" type="button" data-filter="metal" aria-pressed="false">Metal</button>
        <button class="filter-button" type="button" data-filter="carton" aria-pressed="false">Cartón</button>
        <button class="filter-button" type="button" data-filter="electronicos" aria-pressed="false">Electrónicos</button>
      </div>

      <p class="results-message" id="results-message" aria-live="polite"></p>

      <div class="centers-grid" id="centers-grid">
        <!-- Las tarjetas se generan desde js/centros.js con los datos de js/centros-data.js -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>EcoPuntos | Cuidar el planeta está en nuestras manos</p>
  </footer>
</body>
</html>

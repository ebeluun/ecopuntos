<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Consulta centros de reciclaje y los materiales que reciben.">
  <title>Centros de reciclaje | EcoPuntos</title>
  <link rel="stylesheet" href="css/centros.css">
  <link rel="stylesheet" href="css/header-usuario.css">
  <script src="js/centros-data.js" defer></script>
  <script src="js/centros.js" defer></script>
  <script src="js/header-usuario.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="EcoPuntos, ir al inicio">
      <span class="brand-icon" aria-hidden="true">♻️</span>
      <span>EcoPuntos</span>
    </a>
    <nav class="main-nav" aria-label="Navegación principal">
      <a href="index.html">Inicio</a><span aria-hidden="true">|</span>
      <a href="centros.html" aria-current="page">Centros</a><span aria-hidden="true">|</span>
      <a href="materiales.html">Materiales</a><span aria-hidden="true">|</span>
      <a href="index.html#login-dialog">Iniciar sesión</a>
    </nav>
  </header>

  <main>
    <section class="page-heading" aria-labelledby="page-title">
      <h1 id="page-title">Centros de reciclaje</h1>
      <p>Encuentra un lugar para llevar tus materiales y contribuir con el planeta</p>
    </section>

    <section class="centers-search" aria-label="Buscar centros de reciclaje">
      <label class="search-box" for="search-centers">
        <span aria-hidden="true">🔍</span>
        <input id="search-centers" type="search" placeholder="Buscar por nombre o ubicación..." autocomplete="off">
      </label>

      <div class="filter-buttons" role="group" aria-label="Filtrar por material">
        <button class="filter-button active" type="button" data-filter="todos" aria-pressed="true">Todos</button>
        <button class="filter-button" type="button" data-filter="plastico" aria-pressed="false">Plástico</button>
        <button class="filter-button" type="button" data-filter="papel" aria-pressed="false">Papel</button>
        <button class="filter-button" type="button" data-filter="vidrio" aria-pressed="false">Vidrio</button>
        <button class="filter-button" type="button" data-filter="metal" aria-pressed="false">Metal</button>
        <button class="filter-button" type="button" data-filter="carton" aria-pressed="false">Cartón</button>
        <button class="filter-button" type="button" data-filter="electronicos" aria-pressed="false">Electrónicos</button>
      </div>

      <p class="results-message" id="results-message" aria-live="polite"></p>
      <div class="centers-grid" id="centers-grid"></div>
      <p class="centers-feedback" id="centers-feedback" role="status" aria-live="polite"></p>
    </section>
  </main>

  <dialog class="center-edit-dialog" id="center-edit-dialog" aria-labelledby="center-edit-title">
    <form id="center-edit-form">
      <div class="center-edit-heading">
        <div><p class="center-edit-eyebrow">Administrar catálogo</p><h2 id="center-edit-title">Editar centro</h2></div>
        <button type="button" class="center-dialog-close" id="close-center-dialog" aria-label="Cerrar">×</button>
      </div>
      <label for="center-name">Nombre del centro</label>
      <input id="center-name" name="name" type="text" maxlength="70" required>
      <label for="center-location">Ubicación</label>
      <input id="center-location" name="location" type="text" maxlength="100" required>
      <label for="center-icon">Ícono (emoji)</label>
      <input id="center-icon" name="icon" type="text" maxlength="8" required>
      <fieldset class="center-material-options">
        <legend>Materiales que recibe</legend>
        <label><input type="checkbox" name="materials" value="plastico"> Plástico</label>
        <label><input type="checkbox" name="materials" value="papel"> Papel</label>
        <label><input type="checkbox" name="materials" value="carton"> Cartón</label>
        <label><input type="checkbox" name="materials" value="vidrio"> Vidrio</label>
        <label><input type="checkbox" name="materials" value="metal"> Metal</label>
        <label><input type="checkbox" name="materials" value="electronicos"> Electrónicos</label>
      </fieldset>
      <label for="center-description">Descripción</label>
      <textarea id="center-description" name="description" rows="3" maxlength="300" required></textarea>
      <p class="center-edit-error" id="center-edit-error" role="alert"></p>
      <div class="center-edit-actions">
        <button type="button" class="center-cancel" id="cancel-center-edit">Cancelar</button>
        <button type="submit" class="center-save">Guardar cambios</button>
      </div>
    </form>
  </dialog>

  <footer class="site-footer"><p>EcoPuntos | Cuidar el planeta está en nuestras manos</p></footer>
</body>
</html>

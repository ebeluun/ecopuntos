
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | EcoPuntos</title>

    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/componentes.css">
    <link rel="stylesheet" href="css/header-usuario.css">

    <script src="js/header-usuario.js" defer></script>
</head>
<body>

    <!-- Encabezado compartido -->
    <header class="site-header">
        <a href="index.html" class="brand">
            <span class="brand-icon">♻</span>
            EcoPuntos
        </a>

        <nav class="main-nav" aria-label="Navegación principal">
            <a href="index.html">Inicio</a>
            <a href="centros.html">Centros</a>
            <a href="login.html">Iniciar sesión</a>
            <a href="perfil.html">Mi perfil</a>
        </nav>
    </header>

    <main class="contenedor">
        <section class="formulario">
            <h1>Crear una cuenta</h1>

            <form id="form-registro" novalidate>

                <label for="nombre">Nombre completo</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Escribe tu nombre"
                    autocomplete="name"
                    required
                >

                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="ejemplo@correo.com"
                    autocomplete="email"
                    spellcheck="false"
                    required
                >

                <label for="usuario">Nombre de usuario</label>
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Elige un usuario"
                    autocomplete="username"
                    required
                >

                <label for="contrasena">Contraseña</label>
                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    placeholder="Crea una contraseña"
                    autocomplete="new-password"
                    minlength="8"
                    required
                    aria-describedby="ayuda-contrasena"
                >

                <small id="ayuda-contrasena" class="ayuda-campo">
                    Mínimo 8 caracteres, incluyendo al menos una letra y un número.
                </small>

                <button type="submit">Registrarme</button>

                <p
                    id="mensaje"
                    class="mensaje"
                    role="status"
                    aria-live="polite"
                ></p>

            </form>

            <p class="enlace-registro">
                ¿Ya tienes una cuenta?
                <a href="login.html">Inicia sesión</a>
            </p>
        </section>
    </main>

    <!-- Pie de página compartido -->
    <footer class="site-footer">
        <p>EcoPuntos - Cada entrega cuenta para cuidar el planeta.</p>
    </footer>

    <script src="js/auth.js"></script>

</body>
</html>
